<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>京都皇帝早生桐 LP｜株式会社SANSEI</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="nae/img/icon-32x32.jpg" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
:root{--deep:#0c110b;--cream:#f2ede1;--leaf:#b9c99a}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--deep);color:#ebe9df;font-family:"Zen Kaku Gothic New",system-ui,sans-serif;letter-spacing:.06em}
header{padding:20px clamp(20px,5vw,72px)}.logo{display:inline-block}.logo img{height:52px;width:auto;display:block}
main{display:grid;gap:14px;padding:clamp(24px,5vh,60px) clamp(20px,5vw,72px) 60px}
@media(min-width:900px){main{grid-template-columns:1fr 1fr;min-height:calc(100svh - 110px)}}
a.door{position:relative;display:flex;align-items:flex-end;min-height:62svh;overflow:hidden;color:inherit;text-decoration:none;border-radius:4px}
a.door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.8s cubic-bezier(.16,1,.3,1)}
a.door:hover img{transform:scale(1.06)}
a.door::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,17,11,.95),rgba(12,17,11,.2) 70%)}
.in{position:relative;z-index:2;padding:clamp(22px,3vw,44px)}
.en{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--leaf);font-size:clamp(17px,1.6vw,22px)}
h2{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(30px,3.6vw,56px);line-height:1.25;margin:.3em 0 .4em}
p{margin:0;color:rgba(235,233,223,.75);font-size:16px;line-height:1.9}
.go{display:inline-block;margin-top:1.2em;color:var(--leaf);font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:19px}
</style>
</head>
<body>
<header><span class="logo"><img src="nae/img/logo-header.png" srcset="nae/img/logo-header.png 1x, nae/img/logo-header-sp.png 2x" alt="株式会社SANSEI" width="170" height="52"></span></header>
<main>
  <a class="door" href="nae/"><img src="nae/img/seedlings-pair-sm.jpg" alt=""><div class="in"><span class="en">Seedlings</span><h2>苗の販売</h2><p>苗は1本から。5年で成木、伐っても、また生える。</p><span class="go">苗のページへ →</span></div></a>
  <a class="door" href="sanrin/"><img src="sanrin/img/oita-rows-sm.jpg" alt=""><div class="in"><span class="en">Paulownia Forest for Business</span><h2>山林の販売</h2><p>植林と手入れを終えた山を、山ごと。同じ山から、5年ごとに木材を。</p><span class="go">山林のページへ →</span></div></a>
</main>
</body>
</html>
